services:
  # Service 1: Le nœud Monero (daemon)
  monerod:
    image: sethsimmons/simple-monerod:latest
    container_name: monerod-testnet
    restart: unless-stopped
    ports:
      - "28081:28081"  # Port RPC
      - "28080:28080"  # Port P2P
    volumes:
      - monero_testnet_data:/home/monero/.bitmonero
    command:
      - "--testnet"
      - "--rpc-bind-ip=0.0.0.0"
      - "--rpc-bind-port=28081"
      - "--rpc-restricted-bind-ip=0.0.0.0"
      - "--confirm-external-bind"
      - "--no-igd"
      - "--non-interactive"
      - "--log-level=1"
    user: "1000:1000"
    networks:
      - monero-network

  # Service 2: Le Wallet RPC
  monero-wallet-rpc:
    image: sethsimmons/simple-monero-wallet-rpc:latest  # Image spécifique et vérifiée
    container_name: monero-wallet-rpc-testnet
    restart: unless-stopped
    depends_on:
      - monerod
    ports:
      - "28083:28083"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      monero-wallet-rpc
      --testnet
      --daemon-host=monerod
      --daemon-port=28081
      --rpc-bind-ip=0.0.0.0
      --rpc-bind-port=28083
      --wallet-dir=/home/monero/wallets
      --trusted-daemon
      --confirm-external-bind
      --disable-rpc-login
      --non-interactive
      --log-level=1
    user: "1000:1000"
    networks:
      - monero-network

networks:
  monero-network:
    name: monero-network
volumes:
  monero_testnet_data:
  monero_wallet_data:
  postgres_data: