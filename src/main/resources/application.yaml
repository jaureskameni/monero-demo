---
server:
  port: 8085
spring:
  application:
    name: "monero-demo"
  datasource:
    url: "jdbc:postgresql://localhost:5432/payment_db"
    username: "payment_user"
    password: "payment_pass"
  jpa:
    hibernate:
      ddl-auto: "update"
    show-sql: true
    properties:
      hibernate:
        dialect: "org.hibernate.dialect.PostgreSQLDialect"
        format_sql: true
jkdev:
  monero:
    rpc:
      id: "0"
      version: "2.0"
      enabled: false
      url: "http://localhost:28083/json_rpc"
      username: ""
      password: ""
      account-index: 0
