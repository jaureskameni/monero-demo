---
server:
  port: 8085
spring:
  application:
    name: "monero-demo"
  datasource:
    url: "jdbc:postgresql://localhost:5432/payment_db"
    username: "payment_user"
    password: "payment_pass"
  jpa:
    hibernate:
      ddl-auto: "update"
    show-sql: true
    properties:
      hibernate:
        dialect: "org.hibernate.dialect.PostgreSQLDialect"
monero:
  rpc:
    url: "${RPC_URI:http://localhost:28083/json_rpc}"
